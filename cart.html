<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | SoundWave</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SoundWave</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
					<li class="nav-item"><a class="nav-link" href="products.html">Manage Tracks</a></li>
					<li class="nav-item"><a class="nav-link active" href="cart.html">Shopping Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="signup.html">Join SoundWave</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container my-4">

        <h1 class="section-title mb-4">Shopping Cart</h1>

        <!-- Success / error message -->
        <div id="message" class="alert d-none"></div>

        <!-- Search -->
        <h2 class="h4">Find Tracks</h2>
        <input type="text" class="form-control mb-2" id="searchBox"
               placeholder="Search by title, genre, format or artist...">
        <p class="text-muted small mb-3" id="resultCount"></p>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Genre</th>
                    <th>Format</th>
                    <th>Price</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>

        <!-- Cart -->
        <h2 class="h4 mt-5">Your Cart</h2>

        <table class="table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="cartBody"></tbody>
        </table>

        <p class="fw-bold fs-5">Total: <span id="cartTotal">$0.00</span></p>

        <button type="button" class="btn btn-sw" id="checkoutBtn">Send Cart to API</button>
        <button type="button" class="btn btn-outline-secondary" id="clearCartBtn">Clear Cart</button>

        <!-- Cart JSON preview: this is the exact body the AJAX call sends (filled in by cart.jquery.js) -->
        <h2 class="h5 mt-5">Cart JSON</h2>
        <pre id="cartJson" class="bg-white border rounded p-3 small"></pre>

    </main>

    <!-- Footer -->
    <footer class="sw-footer text-white text-center py-3">
        <p class="mb-0">&copy; 2026 SoundWave Music Community</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cart.js"></script>
    <script src="cart.jquery.js"></script>

</body>
</html>
